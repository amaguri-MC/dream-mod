name: server-test
on:
  push:
    branches-ignore: [builds, gametest-out]
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run dedicated server on a fresh world
        run: |
          chmod +x ./gradlew
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "level-name=yume\nonline-mode=false\n" > run/server.properties
          (timeout 300 ./gradlew runServer --args="nogui" > server.log 2>&1 || true)
          grep -E "Done \(|ERROR|Exception|Overworld settings" server.log | head -40
          grep -q "Done (" server.log
